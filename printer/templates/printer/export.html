<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job {{ printout.job_number }}{% if printout.title %} · {{ printout.title }}{% endif %}</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; padding: 2rem 1rem; background: #2e2c28; }
    .paper { max-width: 960px; margin: 0 auto; }
{{ css|safe }}
  </style>
</head>
<body>
  <article class="paper paper-green ribbon-four">
    <header class="paper-head">
      <span>JOB {{ printout.job_number }}</span>
      <span>{{ result.label|upper }}</span>
      <span>{{ printout.created|date:"Y-m-d H:i" }}</span>
    </header>
    <div class="feed">
      <ol class="listing">{% for line in result.lines %}<li><code>{{ line|safe }}</code></li>{% endfor %}</ol>
    </div>
  </article>
</body>
</html>
